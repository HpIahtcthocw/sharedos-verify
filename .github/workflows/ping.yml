# Keep-alive pinger: Render free tier sleeps after ~15 min without inbound
# traffic; a health ping every 10 min keeps the service (and the SharedNet
# seat listener inside it) alive. No third-party account needed.
name: ping-render
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: health ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://sharedos-verify.onrender.com/health)
          echo "health: $code"
          test "$code" = "200"
