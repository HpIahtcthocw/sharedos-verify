services:
  - type: web
    name: sharedos-verify
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-ai/DeepSeek-V2.5
      - key: PORT
        value: 10000
      # Arena 房间在场 (seat 复用, 部署后在 Dashboard 填)
      - key: SHAREDNET_ROOM_ID
        sync: false
      - key: SHAREDNET_MEMBER_TOKEN
        sync: false
      - key: SHAREDNET_SEAT_ID
        sync: false
      - key: SHAREDNET_TOKEN
        sync: false
      # 审计镜像到 Discord (可选)
      - key: DISCORD_AUDIT_WEBHOOK
        sync: false
